<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <title>Admin Dashboard</title>
</head>
<body>
    <div id="side-container">
        <button id="side-button">
            <img class="img-button" src="icons/view-dashboard.svg">Dashboard</button>
        <br>
        <button class="side-button">
            <img class="img-button" src="icons/home.svg">Home</button>
        <button class="side-button">
            <img class="img-button" src="icons/card-account-details.svg">Profile</button>
        <button class="side-button">
            <img class="img-button" src="icons/message-reply.svg">Messages</button>
        <button class="side-button">
            <img class="img-button" src="icons/clock-time-three.svg">History</button>
        <button class="side-button">
            <img class="img-button" src="icons/file-multiple.svg">Tasks</button>
        <button class="side-button">
            <img class="img-button" src="icons/account-group.svg">Communities</button>
        <br>
        <button class="side-button">
            <img class="img-button" src="icons/cog.svg">Settings</button>
        <button class="side-button">
            <img class="img-button" src="icons/help-box.svg">Support</button>
        <button class="side-button">
            <img class="img-button" src="icons/shield-check.svg">Privacy</button>
    </div>

    <div id="main-container">
        <div id="top-container">
            <div id="search">
                <img id="magnify" src="icons/magnify.svg">
                <input type="search">
            </div>
            <div id="right-search">
                <img id="bell" src="icons/bell-ring-outline.svg">
                <img id="cat" src="images/cat.jpg">
                <div>Morgan Oakley</div>
            </div>

            <div id="greet">
                <img src="images/cat.jpg">
                <div id="greet-hi">Hi there,</div>
                <div id="greet-name">Morgan Oakley (@morgan)</div>
            </div>
            <div id="greet-buttons">
                <button class="greet-button">New</button>
                <button class="greet-button">Upload</button>
                <button class="greet-button">Share</button>
            </div>
        </div>
        <div id="bottom-container">

        </div>
    </div>
</body>
</html>
